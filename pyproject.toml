[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evid"
version = "0.6.1"
description = "Evidence management: PDF labeling, vector search, and citation gather."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "ruamel.yaml>=0.17",
    "python-slugify",
    "arrow",
    "rich",
    "requests",
    "beautifulsoup4",
    "pypdf",
    "PyMuPDF",
    "treeparse>=0.2.8",
    "bibtexparser",
    "demoji",
    "GitPython",
    "rapidfuzz>=3.10.0,<4",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
gui = ["PySide6"]
vec = ["chromadb", "sentence-transformers"]
all = ["PySide6", "chromadb", "sentence-transformers"]

[project.scripts]
evid = "evid.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evid"]
force-include = { "src/evid/gui/assets/jura.svg" = "evid/gui/assets/jura.svg", "src/evid/gui/assets/jura.png" = "evid/gui/assets/jura.png" }

[tool.hatch.build.targets.editable]
packages = ["src/evid"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "ruff",
]
# torch comes in via the vec extra (sentence-transformers). Its default PyPI wheel is
# the CUDA build, which drags in ~15 nvidia-* packages (multiple GB) even on a machine
# with no NVIDIA GPU. evid only runs a 384-dim embedding model, on CPU, so `cpu` is the
# default group. On an NVIDIA box:
# `uv sync --no-default-groups --all-extras --group dev --group gpu`.
cpu = ["torch"]
gpu = ["torch"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["S101", "S104", "COM812", "ISC001", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/gui_readme_shots.py" = [
  "T201", "PLC0415", "SLF001", "ARG001", "EXE001",
  "SIM105", "S110", "BLE001",
]
# conftest.py is a pytest hook file, not part of an importable package
