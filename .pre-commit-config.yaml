default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        language: system
        entry: bash -c 'uv run --no-sync pytest -q --tb=short'
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
